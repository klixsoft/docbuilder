    post:
      operationId: v1_logout_create
      summary: User Logout
      description: |
        Logs out the current user and invalidates their authentication tokens. This endpoint revokes the access token and refresh token to ensure the user session is properly terminated. After logout, the user will need to login again to access protected resources. This is important for security, especially on shared devices, and helps maintain proper session management. The endpoint may also clear server-side session data if applicable.
      tags:
        - authentication
