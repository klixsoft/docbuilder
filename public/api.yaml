openapi: 3.0.3
info:
  title: Mediisha API
  version: 2.0.9
  description:
    Mediisha is a comprehensive digital health platform that offers mental
    health consultations, health information management solutions, health insurance
    program facilitation, and more. Your healthcare needs, just a click away!

servers:
  - url: https://mediisha.app
    description: Production Server
  - url: https://dev.mediisha.app
    description: Development Server

paths:
  /api/v1/app/settings/{path}/:
    get:
      summary: App Settings
      description: Retrieve the application settings for a specific path.
      operationId: v1_app_settings_retrieve
      parameters:
        - in: path
          name: path
          description: The specific settings path to retrieve.
          schema:
            type: string
            enum:
              - general
              - package
              - instant-consultation
              - sticky-promo
              - parental-care
              - faq
              - redeem-points
              - chat-cards
              - partner-app-modal
              - blood-bank-card
              - cancer-support-card
              - featured-quiz
              - cancer
              - homepagepopup
              - versionupdate
              - healthpackages
          required: true
      tags:
        - settings
      security:
        - jwtAuth: []
      responses:
        "200":
          description: No response body
  /api/v1/app/slider/:
    get:
      operationId: v1_app_slider_list
      summary: App Sliders
      description: Retrieve a paginated list of app sliders.
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
      tags:
        - settings
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSliderList"
          description: ""
  /api/v1/articles/:
    get:
      summary: Articles
      description: Retrieve a paginated list of articles.
      operationId: v1_articles_list
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - articles
      security:
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPostCardList"
          description: ""
  /api/v1/articles/{id}/:
    get:
      operationId: v1_articles_retrieve
      summary: Article Details
      description: Retrieve the details of a specific article by its ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: A unique value identifying this Article.
          required: true
      tags:
        - articles
      security:
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
          description: ""
  /api/v1/articles/{id}/bookmark/:
    get:
      operationId: v1_articles_bookmark_retrieve
      summary: Check Article Bookmark Status
      description: Check if a specific article is bookmarked by the authenticated user. Returns the bookmark status for the given article ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      tags:
        - articles
      security:
        - jwtAuth: []
      responses:
        "200":
          description: No response body
    post:
      operationId: v1_articles_bookmark_create_2
      summary: Bookmark Article
      description: Add a specific article to the authenticated user's bookmarks. This allows users to save articles for later reading and quick access.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      tags:
        - articles
      security:
        - jwtAuth: []
      responses:
        "201":
          description: No response body
  /api/v1/articles/bookmark/:
    get:
      operationId: v1_articles_bookmark_list
      summary: List Bookmarked Articles
      description: Retrieve a paginated list of all articles bookmarked by the authenticated user. This endpoint returns articles that the user has saved for later reading, allowing them to access their saved content easily.
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - articles
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPostCardList"
          description: ""
    post:
      operationId: v1_articles_bookmark_create
      summary: Create Article Bookmark
      description: Create a new bookmark for an article. Users can save articles to their bookmark collection for quick access later. This endpoint allows bookmarking articles by providing the article details in the request body.
      tags:
        - articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCard"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PostCard"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PostCard"
        required: true
      security:
        - jwtAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostCard"
          description: ""
  /api/v1/blood-banks/:
    get:
      operationId: v1_blood_banks_retrieve
      summary: List Blood Banks
      description: Retrieve a list of all registered blood banks in the system. This endpoint provides information about blood banks including their location, contact details, and availability. Useful for users searching for nearby blood banks or donation centers.
      tags:
        - blood-bank
      security:
        - {}
      responses:
        "200":
          description: No response body
  /api/v1/blood-banks/{id}/:
    get:
      operationId: v1_blood_banks_retrieve_2
      summary: Get Blood Bank Details
      description: Retrieve detailed information about a specific blood bank by its ID. This includes the blood bank's name, address, contact information, operating hours, and available blood types.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this blood bank.
          required: true
      tags:
        - blood-bank
      security:
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloodBank"
          description: ""
  /api/v1/blood/requests/:
    get:
      operationId: v1_blood_requests_retrieve
      summary: List Blood Donation Requests
      description: Retrieve all active blood donation requests in the system. This endpoint shows urgent and non-urgent blood requests from patients and hospitals, including blood type needed, location, and contact information. Helps connect donors with those in need.
      tags:
        - blood-bank
      security:
        - {}
      responses:
        "200":
          description: No response body
    post:
      operationId: v1_blood_requests_create
      summary: Create Blood Donation Request
      description: Create a new blood donation request. Patients or their families can post requests for specific blood types, specifying urgency level, location, hospital details, and patient information. This helps reach potential donors quickly during emergencies.
      tags:
        - blood-bank
      security:
        - {}
      responses:
        "200":
          description: No response body
  /api/v1/blood/requests/{bloodtype}/donars/:
    get:
      operationId: v1_blood_requests_donars_list
      summary: List Blood Donors by Type
      description: Retrieve a paginated list of registered blood donors filtered by blood type. This endpoint helps find potential donors matching a specific blood type requirement (A+, B+, O-, etc.), showing donor contact information and availability status.
      parameters:
        - in: path
          name: bloodtype
          schema:
            type: string
          required: true
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - blood-bank
      security:
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBloodDonarsList"
          description: ""
  /api/v1/blood/requests/{id}/:
    get:
      operationId: v1_blood_requests_retrieve_2
      summary: Get Blood Request Details
      description: Retrieve detailed information about a specific blood donation request by its ID. This includes patient details, required blood type, urgency level, hospital information, and current status of the request.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - blood-bank
      security:
        - {}
      responses:
        "200":
          description: No response body
    post:
      operationId: v1_blood_requests_create_2
      summary: Update Blood Request
      description: Update an existing blood donation request. This can be used to modify request details such as urgency status, contact information, or mark the request as fulfilled when a donor is found.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - blood-bank
      security:
        - {}
      responses:
        "200":
          description: No response body
  /api/v1/blood/requests/{id}/acceptances/:
    get:
      operationId: v1_blood_requests_acceptances_list
      summary: List Donation Acceptances
      description: Retrieve a paginated list of all donors who have accepted or responded to a specific blood donation request. This shows which donors have committed to donating blood for this particular request, including their contact details and confirmation status.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - blood-bank
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBloodRequestAcceptanceList"
          description: ""
  /api/v1/blood/requests/accept/invitation/:
    post:
      operationId: v1_blood_requests_accept_invitation_create
      summary: Accept Donation Invitation
      description: Accept an invitation to donate blood for a specific request. When a donor is willing to donate blood, they use this endpoint to confirm their acceptance and notify the requester. Requires authentication to track donor commitments.
      tags:
        - blood-bank
      security:
        - jwtAuth: []
      responses:
        "200":
          description: No response body
  /api/v1/blood/requests/summary/:
    get:
      operationId: v1_blood_requests_summary_retrieve
      summary: Blood Requests Summary
      description: Get a summary overview of all blood donation requests including statistics like total active requests, requests by blood type, urgent vs non-urgent requests, and fulfillment rates. Useful for dashboard and analytics.
      tags:
        - blood-bank
      responses:
        "200":
          description: No response body
  /api/v1/booking/slot/:
    post:
      operationId: v1_booking_slot_create
      summary: Book Consultation Slot
      description: Book a specific time slot for a doctor consultation. Users can reserve an available appointment slot with their chosen doctor, providing patient details and preferred consultation time. This creates a confirmed booking in the system.
      tags:
        - consultations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookedConsultationStatus"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/BookedConsultationStatus"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BookedConsultationStatus"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookedConsultationStatus"
          description: ""
  /api/v1/cancer/:
    get:
      operationId: v1_cancer_retrieve
      summary: Get Cancer Support Information
      description: Retrieve information about the cancer support program including available services, how to request cancer report reviews, consultation options, and program guidelines. This provides an overview of cancer care services offered through the platform.
      tags:
        - cancer-support
      security:
        - jwtAuth: []
      responses:
        "200":
          description: No response body
  /api/v1/cancer/requests/:
    get:
      operationId: v1_cancer_requests_list
      summary: List Cancer Review Requests
      description: Retrieve a paginated list of cancer report review requests submitted by the authenticated user. This shows all requests for second opinions on cancer diagnoses, pathology reports, or treatment plans, including their current status (pending, under review, completed).
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
      tags:
        - cancer-support
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCancerReviewRequestList"
          description: ""
    post:
      operationId: v1_cancer_requests_create
      summary: Create Cancer Review Request
      description: Submit a new request for cancer report review by medical experts. Users can upload pathology reports, biopsy results, or imaging studies for a second opinion. The request initiates the review process and connects users with oncology specialists.
      tags:
        - cancer-support
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancerReviewRequestCreate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CancerReviewRequestCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CancerReviewRequestCreate"
        required: true
      security:
        - jwtAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancerReviewRequestCreate"
          description: ""
  /api/v1/cancer/requests/{id}/:
    get:
      operationId: v1_cancer_requests_retrieve
      summary: Get Cancer Review Request Details
      description: Retrieve detailed information about a specific cancer review request including uploaded documents, review status, expert comments, and recommendations. This allows users to track the progress of their case and access medical opinions.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this Cancer Request.
          required: true
      tags:
        - cancer-support
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancerReviewRequest"
          description: ""
    put:
      operationId: v1_cancer_requests_update
      summary: Update Cancer Review Request
      description: Update all fields of an existing cancer review request. Users can modify patient information, add additional medical history, or update contact details before the review is finalized.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this Cancer Request.
          required: true
      tags:
        - cancer-support
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancerReviewRequest"
          description: ""
    patch:
      operationId: v1_cancer_requests_partial_update
      summary: Partially Update Cancer Review Request
      description: Update specific fields of an existing cancer review request without modifying the entire object. Useful for making targeted updates like changing status or adding notes.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this Cancer Request.
          required: true
      tags:
        - cancer-support
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedCancerReviewRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PatchedCancerReviewRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchedCancerReviewRequest"
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancerReviewRequest"
          description: ""
    delete:
      operationId: v1_cancer_requests_destroy
      summary: Delete Cancer Review Request
      description: Delete a cancer review request from the system. This permanently removes the request and associated documents. Typically used when a request was created by mistake or is no longer needed.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this Cancer Request.
          required: true
      tags:
        - cancer-support
      security:
        - jwtAuth: []
      responses:
        "204":
          description: No response body
  /api/v1/cancer/requests/{id}/presigned-url/:
    get:
      operationId: v1_cancer_requests_presigned_url_retrieve
      summary: Get Presigned Upload URL
      description: Generate a presigned URL for securely uploading medical documents (reports, scans, pathology results) directly to cloud storage. This URL is time-limited and provides secure, direct upload capability for large medical files associated with the cancer review request.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this Cancer Request.
          required: true
      tags:
        - cancer-support
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancerReviewRequest"
          description: ""
  /api/v1/cancer/requests/{id}/submit/:
    post:
      operationId: v1_cancer_requests_submit_create
      summary: Submit Cancer Review Request
      description: Submit a cancer review request for expert evaluation after all documents have been uploaded. This moves the request from draft status to the review queue, notifying medical experts to begin the review process.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this Cancer Request.
          required: true
      tags:
        - cancer-support
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancerReviewRequest"
          description: ""
  /api/v1/cancer/requests/{id}/upload/:
    post:
      operationId: v1_cancer_requests_upload_create
      summary: Upload Cancer Documents
      description: Upload medical documents (pathology reports, imaging scans, biopsy results) for a cancer review request. Supports multiple file formats including PDF, JPEG, PNG, and DICOM. Files are securely stored and attached to the review request.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this Cancer Request.
          required: true
      tags:
        - cancer-support
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CancerReviewRequest"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancerReviewRequest"
          description: ""
  /api/v1/categories/{post_type}/:
    get:
      operationId: v1_categories_list
      summary: List Categories by Post Type
      description: |
        Retrieves a paginated list of categories filtered by post type. This endpoint is used to fetch categories for different content types in the application such as articles, health library items, or other categorized content. The post_type parameter determines which category tree to retrieve. Results support pagination for efficient loading of large category lists.
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: path
          name: post_type
          schema:
            type: string
          required: true
      tags:
        - content
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCategoryList"
          description: ""
  /api/v1/categories/{post_type}/children/{parent_id}/:
    get:
      operationId: v1_categories_children_list
      summary: List Child Categories
      description: |
        Retrieves all child categories under a specific parent category within a given post type. This endpoint is useful for building hierarchical category navigation, where users can drill down from parent categories to their children. For example, in a health library, a parent category "Diseases" might have children like "Cardiovascular", "Respiratory", etc. Supports pagination for large category trees.
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: path
          name: parent_id
          schema:
            type: string
          required: true
        - in: path
          name: post_type
          schema:
            type: string
          required: true
      tags:
        - content
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCategoryList"
          description: ""
  /api/v1/categories/{post_type}/hierarchy/:
    get:
      operationId: v1_categories_hierarchy_list
      summary: Get Category Hierarchy
      description: |
        Retrieves the complete hierarchical tree structure of categories for a specific post type. This endpoint returns categories with their nested relationships intact, allowing clients to render full category trees, navigation menus, or breadcrumbs. The recursive structure includes all parent-child relationships in a single response. Useful for building category selectors, filters, or navigation components that need the full category taxonomy.
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: path
          name: post_type
          schema:
            type: string
          required: true
      tags:
        - content
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRecursiveCategoryList"
          description: ""
  /api/v1/checkout/:
    post:
      operationId: v1_checkout_create
      summary: Create Checkout Session
      description: |
        Initiates a checkout session for booking a consultation. This endpoint processes payment information and creates a booked consultation record. It handles the payment transaction, validates the consultation slot availability, and confirms the booking. The request should include consultation details, payment method, and any applicable discount codes. Returns the confirmed booking details with payment status and consultation information.
      tags:
        - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookedConsultation"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/BookedConsultation"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BookedConsultation"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookedConsultation"
          description: ""
  /api/v1/consultation/{consultation_id}/images/:
    get:
      operationId: v1_consultation_images_retrieve
      summary: List Consultation Images
      description: |
        Retrieves all images associated with a specific consultation. These images may include medical photos, test results, prescriptions, or any other visual documentation uploaded by the patient or doctor during the consultation. This endpoint is useful for viewing the complete image history of a consultation session. Images are returned with their metadata including upload timestamp, file size, and URLs for access.
      parameters:
        - in: path
          name: consultation_id
          schema:
            type: string
          required: true
      tags:
        - consultations
      responses:
        "200":
          description: No response body
    post:
      operationId: v1_consultation_images_create
      summary: Add Consultation Image
      description: |
        Uploads a new image to a specific consultation. Patients can use this to share symptoms, medical documents, or test results with their doctor. Doctors can upload prescriptions, reports, or other relevant medical images. The image is securely stored and associated with the consultation record. Supports common image formats (JPEG, PNG, PDF) with size validation to ensure optimal performance.
      parameters:
        - in: path
          name: consultation_id
          schema:
            type: string
          required: true
      tags:
        - consultations
      responses:
        "200":
          description: No response body
    delete:
      operationId: v1_consultation_images_destroy
      summary: Delete All Consultation Images
      description: |
