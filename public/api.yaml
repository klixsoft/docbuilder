components:
  schemas:
    AmbulanceCard:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        contact_name:
          type: string
          nullable: true
          maxLength: 255
        contact_number:
          type: string
          readOnly: true
        district:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/DistrictEnum"
            - $ref: "#/components/schemas/BlankEnum"
            - $ref: "#/components/schemas/NullEnum"
      required:
        - contact_number
        - id
        - title
    ArticleTypeEnum:
      enum:
        - image
        - video
        - audio
        - file
      type: string
      description: |-
        * `image` - Image
        * `video` - Video
        * `audio` - Audio
        * `file` - File
    AssistantVoice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file_name:
          type: string
          nullable: true
          maxLength: 255
        voice:
          type: string
          format: uri
          nullable: true
        active:
          type: boolean
        date_created:
          type: string
          format: date-time
          readOnly: true
      required:
        - date_created
        - id
    BlankEnum:
      enum:
        - ""
    BloodBank:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 1000
        description:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        address:
          type: string
          readOnly: true
        distance:
          type: string
          readOnly: true
        cordinates:
          type: string
          readOnly: true
        gallery:
          type: string
          readOnly: true
        branches:
          type: string
          readOnly: true
        google_map_link:
          type: string
          readOnly: true
        blood_availability:
