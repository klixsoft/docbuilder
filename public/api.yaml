      operationId: v1_login_create
      summary: User Login
      description: |
        Authenticates a user and creates a session. This endpoint accepts user credentials (email/phone and password) and validates them against the stored user data. Upon successful authentication, it returns authentication tokens (access token and refresh token) that the client should use for subsequent API requests. The endpoint also handles account status checks to ensure the user account is active and verified. Failed login attempts are logged for security monitoring.
