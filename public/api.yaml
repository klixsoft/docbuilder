        - in: path
          name: folder_id
          schema:
            type: string
          required: true
      tags:
        - document-management
      summary: Upload to Folder
      description: |
          Uploads files to a document folder.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UserDocuments"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDocuments"
          description: ""
  /api/v1/user/health/profile/:
    get:
      operationId: v1_user_health_profile_retrieve
      tags:
        - user-management
      summary: Manage Health Profile
      description: |
          Manages user health profile and medical history.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthProfile"
          description: ""
  /api/v1/user/token/refresh/:
    post:
      operationId: v1_user_token_refresh_create
      summary: Refresh Token
      description: |
          Refreshes authentication token. Takes a refresh type JSON web token and returns an access type JSON web token if the refresh token is valid.
      tags:
        - authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefresh"
          description: ""
  /api/v1/user/token/verify/:
    post:
      operationId: v1_user_token_verify_create
      summary: Verify Token
      description: |
          Verifies authentication token validity. Takes a token and indicates if it is valid. This view provides no information about a token's fitness for a particular use.
      tags:
        - authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenVerify"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenVerify"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TokenVerify"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenVerify"
          description: ""
  /api/v1/verify-email/:
    post:
      operationId: v1_verify_email_create
      tags:
        - authentication
      summary: Verify Email
      description: |
          Verifies user email address using verification code.
      responses:
        "200":
          description: No response body
  /api/v1/verify/account/deletion/:
    post:
      operationId: v1_verify_account_deletion_create
      tags:
        - user-management
      summary: Verify Account Deletion
      description: |
          Verifies account deletion request before permanent removal.
      responses:
        "200":
          description: No response body
  /api/v1/verify/phone/{userid}/:
    post:
      operationId: v1_verify_phone_create
      parameters:
        - in: path
          name: userid
          schema:
            type: integer
          required: true
      tags:
        - authentication
      summary: Verify Phone
      description: |
          Verifies user phone number using OTP.
      security:
        - jwtAuth: []
        - {}
      responses:
        "200":
          description: No response body
  /api/v1/videos/:
    get:
      operationId: v1_videos_retrieve
      tags:
        - content
      summary: List Health Videos
      description: |
          Retrieves educational health videos.
      security:
        - jwtAuth: []
      responses:
        "200":
          description: No response body
