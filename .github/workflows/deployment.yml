name: Build and Push Next.js Deployment (Standalone + Dockerfile)

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create temporary .env.production for build
        env:
          OPENAI_SCHEMA_FILE: api.yaml
          AUTH_SECRET_KEY: b9e5cd63acc57ab0fe4fb30348b65046c8fe0e2865b54ce1fbc5fda58d2d5915
          APP_PROTECTION_VALUES: admin
          THEME: light
        run: |
          echo "🛠 Creating .env.production for build..."
          cat > .env.production <<EOF
          OPENAI_SCHEMA_FILE=api.yaml
          AUTH_SECRET_KEY=b9e5cd63acc57ab0fe4fb30348b65046c8fe0e2865b54ce1fbc5fda58d2d5915
          APP_PROTECTION_VALUES=admin
          THEME=light
          EOF
          echo "✅ .env.production created for build"
          # Mask all secrets in logs
          cat .env.production | sed -E 's/(SECRET|PASS)=.*/\1=*****/g'

      - name: Build Next.js standalone app
        env:
          OPENAI_SCHEMA_FILE: api.yaml
          AUTH_SECRET_KEY: b9e5cd63acc57ab0fe4fb30348b65046c8fe0e2865b54ce1fbc5fda58d2d5915
          APP_PROTECTION_VALUES: admin
          THEME: light
        run: |
          export NODE_ENV=production
          npm run build

          # Verify standalone was created
          if [ ! -d ".next/standalone" ]; then
            echo "❌ ERROR: .next/standalone not found!"
            echo "Current .next directory:"
            ls -la .next/
            exit 1
          fi

          echo "📦 Standalone directory contents:"
          ls -la .next/standalone/

          # Copy static assets for node server.js
          echo "📦 Copying static assets to standalone..."
          cp -r public .next/standalone/ || echo "⚠️ No public folder"

          # Ensure .next directory exists in standalone
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/ || echo "⚠️ No static folder"

          # Copy other necessary .next files
          echo "📦 Copying additional .next files..."
          cp -r .next/server .next/standalone/.next/ 2>/dev/null || echo "⚠️ No server folder"
          cp .next/package.json .next/standalone/.next/ 2>/dev/null || echo "⚠️ No package.json"
          cp .next/BUILD_ID .next/standalone/.next/ 2>/dev/null || echo "⚠️ No BUILD_ID"

          echo "✅ Standalone output prepared"
          echo "Final standalone structure:"
          ls -la .next/standalone/
          echo ""
          echo ".next folder in standalone:"
          ls -la .next/standalone/.next/ || echo "❌ .next not created!"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone/
          include-hidden-files: true

  push_deployment:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./standalone-build

      - name: Prepare and push deployment branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin
          git checkout -B deployment

          # Debug: Check what was downloaded
          echo "🔍 Checking downloaded artifact structure..."
          echo "📂 Current directory contents:"
          ls -la
          echo ""
          echo "📂 Standalone-build directory contents:"
          ls -la standalone-build/
          echo ""
          echo "📂 Checking for .next folder:"
          ls -la standalone-build/.next/ || echo "❌ .next not found!"
          echo ""

          # Clean everything except .git
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name "standalone-build" -exec rm -rf {} +

          # Copy standalone build
          echo "📦 Copying standalone build to root..."
          cp -r standalone-build/* ./

          # IMPORTANT: Also copy hidden .next folder explicitly
          echo "📦 Copying .next folder..."
          cp -r standalone-build/.next ./ || echo "❌ Failed to copy .next!"

          # Remove the standalone-build folder (we don't need it in deployment)
          echo "🧹 Removing standalone-build folder..."
          rm -rf standalone-build

          # Verify critical files exist
          if [ ! -f "server.js" ]; then
            echo "❌ ERROR: server.js not found after copy!"
            exit 1
          fi

          if [ ! -d ".next" ]; then
            echo "❌ ERROR: .next folder not found after copy!"
            exit 1
          fi

          echo "✅ Standalone build copied successfully"
          echo "📂 Final directory structure:"
          ls -la
          echo ""
          echo "📂 .next folder contents:"
          ls -la .next/

          # Create Dockerfile dynamically
          cat > Dockerfile <<'EOF'
          FROM node:20-alpine
          WORKDIR /app

          RUN apk add --no-cache libc6-compat curl && \
              addgroup -S nodejs && \
              adduser -S nextjs -G nodejs

          COPY --chown=nextjs:nodejs . .

          USER nextjs
          EXPOSE 3003

          ENV NODE_ENV=production \
              NEXT_TELEMETRY_DISABLED=1 \
              PORT=3003 \
              HOSTNAME="0.0.0.0"

          CMD ["node", "server.js"]
          EOF

          echo "✅ Dockerfile created"

          # Force add .next folder (override gitignore)
          git add -f .next
          git add .
          git commit -m "chore: standalone build + Dockerfile from ${GITHUB_SHA}" || echo "No changes to commit"
          git push origin deployment --force

      - name: Done
        run: echo "🚀 Deployment branch updated successfully with standalone Next.js build + Dockerfile!"